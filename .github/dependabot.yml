# Keeps action pins and Go deps current — see docs/rules.md#d017-noactionsupdateautomation
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # We dogfood our own action via the floating v0 tag on purpose;
      # pinning it to a fixed release would defeat the point.
      - dependency-name: linnea-bakshi/gha-doctor
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
