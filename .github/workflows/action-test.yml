name: Action test
on:
  push:
    branches: [main]
    paths: ["action.yml", ".github/workflows/action-test.yml"]
  pull_request:
    paths: ["action.yml", ".github/workflows/action-test.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-gate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run action (lint gate — this repo must lint clean)
        uses: ./
      - name: Binary stays on PATH for later steps
        shell: bash
        run: gha-doctor --version

  summary-and-no-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Job-summary mode, non-gating (annotate on by default)
        id: doc
        uses: ./
        with:
          args: --lint-only --dir testdata/demo
          summary: "true"
          fail-on-findings: "false"
      - name: Annotations must not leak into the report file
        shell: bash
        run: |
          set -euo pipefail
          report="${{ steps.doc.outputs.report }}"
          [ -s "$report" ] || { echo "::error::report output file missing"; exit 1; }
          if grep -q '^::' "$report"; then
            echo "::error::workflow commands leaked into the report file"
            exit 1
          fi

  pr-comment:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Sticky PR comment mode, non-gating
        uses: ./
        with:
          args: --lint-only --dir testdata/demo
          pr-comment: "true"
          fail-on-findings: "false"

  baseline:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Baseline mode — gate only on findings this PR introduces
        uses: ./
        with:
          args: --lint-only
          baseline: auto

  pinned-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Pin an explicit release
        uses: ./
        with:
          version: v0.2.1
          args: --version

  fail-on:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: fail-on never — findings must not fail the step
        uses: ./
        with:
          args: --lint-only --dir testdata/demo
          fail-on: never
      - name: Sanity — the demo dir really has gating findings
        shell: bash
        run: |
          set -u
          rc=0
          gha-doctor --lint-only --dir testdata/demo >/dev/null || rc=$?
          if [ "$rc" -ne 2 ]; then
            echo "::error::expected exit 2 from the demo dir, got $rc — the fail-on test above proved nothing"
            exit 1
          fi
      - name: fail-on on a pre-0.48.0 pin — skipped with a note, no crash
        uses: ./
        with:
          version: v0.47.2
          args: --lint-only --dir testdata/demo
          fail-on: never
          fail-on-findings: "false"

  min-score:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: min-score below threshold — fails even though fail-on is never
        id: gate
        continue-on-error: true
        uses: ./
        with:
          args: --lint-only --dir testdata/demo
          fail-on: never
          min-score: "100"
      - name: Assert the score gate tripped (and really had something to trip on)
        shell: bash
        run: |
          set -u
          if [ "${{ steps.gate.outcome }}" != "failure" ]; then
            echo "::error::min-score 100 on the demo dir should have failed the step (outcome: ${{ steps.gate.outcome }})"
            exit 1
          fi
          # The demo dir really scores below 100 with a spoken verdict —
          # otherwise the failure above proved nothing.
          rc=0
          gha-doctor --lint-only --fail-on never --min-score 100 --dir testdata/demo 2>err.txt >/dev/null || rc=$?
          if [ "$rc" -ne 2 ]; then
            echo "::error::expected exit 2 from the score gate, got $rc"
            exit 1
          fi
          grep "min-score gate" err.txt
      - name: min-score met — step passes
        uses: ./
        with:
          args: --lint-only --dir testdata/demo
          fail-on: never
          min-score: "1"
      - name: min-score on a pre-0.61.0 pin — skipped with a note, no crash
        uses: ./
        with:
          version: v0.60.0
          args: --lint-only --dir testdata/demo
          fail-on: never
          min-score: "100"
