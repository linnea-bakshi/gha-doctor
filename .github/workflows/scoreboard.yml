# Regenerates docs/scoreboard.md (the CI health scoreboard page) weekly.
name: Scoreboard
on:
  schedule: [{cron: "43 6 * * 3"}] # Wednesdays 06:43 UTC (badge runs Mondays; off-peak minute, see D014)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scoreboard
  cancel-in-progress: false
jobs:
  scoreboard:
    if: github.repository == 'linnea-bakshi/gha-doctor' # forks: skip cleanly (D021)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: linnea-bakshi/gha-doctor@v0 # installs the binary onto PATH
        with:
          args: --version
      - name: Regenerate scoreboard
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/scoreboard.sh > docs/scoreboard.md
      - name: Commit if changed
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add docs/scoreboard.md
          git diff --cached --quiet || { git commit -m "docs: weekly scoreboard refresh" && git pull --rebase && git push; }
