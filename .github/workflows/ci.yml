name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      # zsh + fish so the completion-script syntax tests run for real
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh fish
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o gha-doctor ./cmd/gha-doctor
      # the browser playground must keep compiling to WASM
      - run: GOOS=js GOARCH=wasm go build -o /dev/null ./cmd/playground
      # dogfood: gha-doctor must pass its own checkup
      - run: ./gha-doctor --lint-only
