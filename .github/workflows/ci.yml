name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
      # zsh + fish so the completion-script syntax tests run for real
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh fish
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o gha-doctor ./cmd/gha-doctor
      # the browser playground must keep compiling to WASM
      - run: GOOS=js GOARCH=wasm go build -o /dev/null ./cmd/playground
      # docs/schema/ is generated from the --json output types; regenerate
      # and fail on any diff so the committed schemas can't drift
      - run: go run ./cmd/genschema && git diff --exit-code docs/schema/
      # dogfood: gha-doctor must pass its own checkup
      - run: ./gha-doctor --lint-only
      # short fuzz smoke so the fuzz harness (and its invariants: no panics,
      # safety valve never fires, --fix idempotent) can't rot
      - run: go test ./internal/lint/ -run '^$' -fuzz FuzzLintBytes -fuzztime 20s
      - run: go test ./internal/lint/ -run '^$' -fuzz FuzzLintActionBytes -fuzztime 20s
      - run: go test ./internal/lint/ -run '^$' -fuzz FuzzFixBytes -fuzztime 20s
      - run: go test ./internal/lint/ -run '^$' -fuzz FuzzUnifiedDiff -fuzztime 20s
      # if a fuzz smoke fails, Go writes the crasher to testdata/fuzz/ in the
      # workspace — upload it byte-exact (log output mangles CR/:: lines and
      # has already cost us one unreproducible crasher)
      - name: Upload fuzz crashers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashers
          path: internal/lint/testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 30

  # The npm wrapper (packaging/npm) downloads checksum-verified release
  # binaries at install time. Exercise its pack → install → run path plus
  # the foreign-platform extractors so it can't rot between releases. The
  # version pinned in its package.json must always be an existing release.
  npm-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install from packed tarball (postinstall download + checksum)
        run: |
          cd packaging/npm
          tarball="$(npm pack --silent)"
          mkdir -p /tmp/npm-smoke && cd /tmp/npm-smoke
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/packaging/npm/$tarball"
          ./node_modules/.bin/gha-doctor --version
      - name: Foreign-platform extraction (zip + tar.gz, checksum-verified)
        run: |
          cd /tmp/npm-smoke/node_modules/gha-doctor
          GHA_DOCTOR_NPM_OS=windows GHA_DOCTOR_NPM_ARCH=arm64 node install.js
          test -s dist/gha-doctor.exe
          GHA_DOCTOR_NPM_OS=darwin GHA_DOCTOR_NPM_ARCH=arm64 node install.js
          test -s dist/gha-doctor

  # The Dockerfile COPYs pre-built binaries from a per-platform layout
  # (goreleaser dockers_v2). Rebuild that layout here and smoke-test the
  # image so the Dockerfile can't rot between releases.
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
      - name: Build binary into goreleaser-style context
        run: |
          mkdir -p /tmp/ctx/linux/amd64
          CGO_ENABLED=0 go build -o /tmp/ctx/linux/amd64/gha-doctor ./cmd/gha-doctor
          cp Dockerfile /tmp/ctx/
      - name: Build image
        run: docker build --platform linux/amd64 -t gha-doctor:smoke /tmp/ctx
      - name: Run image (--version, then a real lint of this repo's workflows)
        run: |
          docker run --rm gha-doctor:smoke --version
          docker run --rm -v "$PWD:/work" -w /work gha-doctor:smoke --lint-only
