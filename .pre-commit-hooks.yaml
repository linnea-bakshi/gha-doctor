# pre-commit hooks for gha-doctor — https://github.com/linnea-bakshi/gha-doctor
#
# Usage (.pre-commit-config.yaml in your repo):
#
#   repos:
#     - repo: https://github.com/linnea-bakshi/gha-doctor
#       rev: v0.49.0  # any release tag
#       hooks:
#         - id: gha-doctor
#
- id: gha-doctor
  name: gha-doctor (GitHub Actions lint)
  description: >-
    Lint GitHub Actions workflows for speed, cost, and reliability
    anti-patterns (missing timeouts, uncached setup, double-triggers, ...).
  entry: gha-doctor --lint-only
  language: golang
  files: ^\.github/workflows/[^/]+\.ya?ml$
  pass_filenames: false

- id: gha-doctor-fix
  name: gha-doctor --fix (auto-fix fixable findings)
  description: >-
    Auto-fix the fixable subset of findings in place (run `gha-doctor --help`
    or see the README for the current rule list); remaining findings are
    still reported. Review changes with git diff.
  entry: gha-doctor --lint-only --fix
  language: golang
  files: ^\.github/workflows/[^/]+\.ya?ml$
  pass_filenames: false
