version: 2

project_name: gha-doctor

builds:
  - main: ./cmd/gha-doctor
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^ci:"]

nfpms:
  - package_name: gha-doctor
    formats: [deb, rpm, apk]
    maintainer: Linnea Bakshi <linnea-bakshi@users.noreply.github.com>
    homepage: https://github.com/linnea-bakshi/gha-doctor
    description: >-
      Diagnose your GitHub Actions: flaky jobs, wasted billable minutes,
      slow steps, cache misses, and workflow anti-patterns — in one command.
    license: MIT
    section: utils
    bindir: /usr/bin
