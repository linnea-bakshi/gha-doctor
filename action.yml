name: gha-doctor
description: >-
  Diagnose your GitHub Actions: workflow lint with autofix, flaky jobs, wasted
  billable minutes, slow steps, and real cache hit rates — in one step.
author: Linnea Bakshi
branding:
  icon: activity
  color: purple

inputs:
  args:
    description: >-
      Arguments passed to gha-doctor. Default lints the workflows in the
      checked-out repo. Shell syntax (redirects, quoting) works.
    required: false
    default: "--lint-only"
  version:
    description: >-
      gha-doctor release to install: a tag like v0.3.0, "latest", or empty
      (default) to match the tag this action was invoked with — falling back
      to latest when invoked via a branch.
    required: false
    default: ""
  github-token:
    description: >-
      Token used by history/cache analysis (--runs, --cache-logs) and for
      release download rate limits. Defaults to the workflow token.
    required: false
    default: ${{ github.token }}
  summary:
    description: >-
      If "true", render the report as Markdown into the job summary
      (appends --md).
    required: false
    default: "false"
  pr-comment:
    description: >-
      If "true" and the event is a pull request, post the report as a sticky
      PR comment (updated in place on each run). Needs `pull-requests: write`
      permission on the job. Posts when there are findings; goes quiet once
      the PR is clean (updates an existing comment to "all clear" rather
      than deleting it).
    required: false
    default: "false"
  baseline:
    description: >-
      Compare against a base branch and report/gate only on findings this
      change introduced. "auto" uses the PR's base branch on pull_request
      events (and is skipped otherwise); any other value is used as a branch
      name. The branch is fetched automatically, so the default shallow
      checkout works.
    required: false
    default: ""
  annotate:
    description: >-
      If "true" (default), pass --annotate so findings show up as inline
      annotations on the PR diff and in the run log — no code-scanning
      setup needed. Annotations are skipped automatically when args make
      stdout machine-readable (--json/--sarif). Set to "false" to turn off.
    required: false
    default: "true"
  fail-on-findings:
    description: >-
      If "true" (default), the step fails when gha-doctor reports findings
      (exit code 2). Set to "false" to report without gating.
    required: false
    default: "true"
  fail-on:
    description: >-
      Severity that makes gha-doctor exit 2: "any" (info-level advice
      gates too), "warning" (the tool's default), or "never" (report-only
      inside the tool). Passed as --fail-on; needs gha-doctor v0.48.0+
      (skipped with a note on older pinned versions). Empty (default)
      leaves the tool's default in place. Note: with "never" the exit
      code is always 0, so the `findings` output reads "false" even when
      the report lists findings — prefer fail-on-findings: "false" if you
      need that output to stay meaningful.
    required: false
    default: ""
  min-score:
    description: >-
      Fail the step when the health score is below this value (0-100).
      Passed as --min-score; needs gha-doctor v0.61.0+ (skipped with a
      note on older pinned versions). Independent of the findings gate:
      combine with fail-on: "never" to gate on score alone. Empty
      (default) = no score gate. Note: a score-gate failure exits 2, so
      the `findings` output reads "true" on score failures too.
    required: false
    default: ""

outputs:
  report:
    description: >-
      Path to the rendered Markdown report file (set in summary/pr-comment
      mode when the run completed with exit 0 or 2).
    value: ${{ steps.run.outputs.report }}
  findings:
    description: >-
      "true" when gha-doctor reported findings, "false" when clean; empty
      when the run errored (summary/pr-comment mode only).
    value: ${{ steps.run.outputs.findings }}

runs:
  using: composite
  steps:
    - name: Install gha-doctor
      id: install
      shell: bash
      env:
        GH_DOCTOR_VERSION: ${{ inputs.version }}
        GH_DOCTOR_ACTION_REF: ${{ github.action_ref }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        repo="linnea-bakshi/gha-doctor"

        version="$GH_DOCTOR_VERSION"
        if [ -z "$version" ]; then
          case "$GH_DOCTOR_ACTION_REF" in
            v[0-9]*.[0-9]*.[0-9]*) version="$GH_DOCTOR_ACTION_REF" ;;
            *) version=latest ;;
          esac
        fi
        if [ "$version" = latest ]; then
          version=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$repo/releases/latest" |
            sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p' | head -n1)
          [ -n "$version" ] || { echo "::error::could not resolve latest gha-doctor release"; exit 1; }
        fi

        case "$RUNNER_OS" in
          Linux)   os=linux ;;
          macOS)   os=darwin ;;
          Windows) os=windows ;;
          *) echo "::error::unsupported runner OS: $RUNNER_OS"; exit 1 ;;
        esac
        case "$RUNNER_ARCH" in
          X64)   arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) echo "::error::unsupported runner arch: $RUNNER_ARCH"; exit 1 ;;
        esac
        ext=tar.gz; [ "$os" = windows ] && ext=zip
        asset="gha-doctor_${version#v}_${os}_${arch}.${ext}"
        base="https://github.com/$repo/releases/download/$version"

        tmp="$RUNNER_TEMP/gha-doctor-install"
        dest="$RUNNER_TEMP/gha-doctor-bin"
        mkdir -p "$tmp" "$dest"
        cd "$tmp"
        echo "Downloading $asset ($version)"
        curl -fsSL --retry 3 -O "$base/$asset"
        curl -fsSL --retry 3 -O "$base/checksums.txt"

        grep " ${asset}\$" checksums.txt > expected.txt
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum -c expected.txt
        else
          shasum -a 256 -c expected.txt
        fi

        if [ "$ext" = zip ]; then
          if command -v unzip >/dev/null 2>&1; then
            unzip -q -o "$asset" -d "$dest"
          else
            python -m zipfile -e "$asset" "$dest"
          fi
        else
          tar -xzf "$asset" -C "$dest"
        fi
        echo "$dest" >> "$GITHUB_PATH"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Run gha-doctor
      id: run
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        FORCE_COLOR: "1"
      run: |
        set -u +e -o pipefail  # composite bash defaults to -e; keep going past exit 2

        baseline_args=""
        base="${{ inputs.baseline }}"
        if [ -n "$base" ]; then
          if [ "$base" = auto ]; then
            base=$(jq -r '.pull_request.base.ref // empty' "$GITHUB_EVENT_PATH" 2>/dev/null)
            [ -n "$base" ] || echo "baseline: auto, but not a pull request event — comparing full report"
          fi
          if [ -n "$base" ]; then
            if git fetch --no-tags --depth=1 origin "+refs/heads/$base:refs/remotes/origin/$base"; then
              baseline_args="--baseline origin/$base"
            else
              echo "::error::baseline: could not fetch origin/$base"
              exit 1
            fi
          fi
        fi

        annotate_args=""
        if [ "${{ inputs.annotate }}" = "true" ]; then
          v="${{ steps.install.outputs.version }}"; v="${v#v}"
          major="${v%%.*}"; rest="${v#*.}"; minor="${rest%%.*}"
          if [ "$major" -gt 0 ] 2>/dev/null || [ "$minor" -ge 35 ] 2>/dev/null; then
            annotate_args="--annotate"
          else
            echo "annotate: gha-doctor v$v predates --annotate (v0.35.0) — skipping"
          fi
        fi

        failon_args=""
        failon="${{ inputs.fail-on }}"
        if [ -n "$failon" ]; then
          v="${{ steps.install.outputs.version }}"; v="${v#v}"
          major="${v%%.*}"; rest="${v#*.}"; minor="${rest%%.*}"
          if [ "$major" -gt 0 ] 2>/dev/null || [ "$minor" -ge 48 ] 2>/dev/null; then
            failon_args="--fail-on $failon"
          else
            echo "fail-on: gha-doctor v$v predates --fail-on (v0.48.0) — skipping"
          fi
        fi

        minscore_args=""
        minscore="${{ inputs.min-score }}"
        if [ -n "$minscore" ]; then
          v="${{ steps.install.outputs.version }}"; v="${v#v}"
          major="${v%%.*}"; rest="${v#*.}"; minor="${rest%%.*}"
          if [ "$major" -gt 0 ] 2>/dev/null || [ "$minor" -ge 61 ] 2>/dev/null; then
            minscore_args="--min-score $minscore"
          else
            echo "min-score: gha-doctor v$v predates --min-score (v0.61.0) — skipping"
          fi
        fi

        rc=0
        if [ "${{ inputs.summary }}" = "true" ] || [ "${{ inputs.pr-comment }}" = "true" ]; then
          report="$RUNNER_TEMP/gha-doctor-report.md"
          FORCE_COLOR=0 gha-doctor ${{ inputs.args }} $baseline_args $annotate_args $failon_args $minscore_args --md | tee "$report"
          rc="${PIPESTATUS[0]}"
          # The runner has already parsed the ::commands from the live
          # stdout above; strip them from the report file so they don't
          # leak into the job summary or the PR comment.
          if grep -q '^::' "$report"; then
            grep -v '^::' "$report" > "$report.clean" || true
            mv "$report.clean" "$report"
          fi
          if [ "${{ inputs.summary }}" = "true" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "report=$report" >> "$GITHUB_OUTPUT"
          case "$rc" in
            0) echo "findings=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "findings=true" >> "$GITHUB_OUTPUT" ;;
          esac
        else
          gha-doctor ${{ inputs.args }} $baseline_args $annotate_args $failon_args $minscore_args || rc=$?
        fi
        if [ "$rc" -eq 2 ] && [ "${{ inputs.fail-on-findings }}" != "true" ]; then
          echo "findings reported; fail-on-findings is false — not failing the step"
          rc=0
        fi
        exit "$rc"

    - name: Post PR comment
      # always(): the comment must land precisely when the run step gated on
      # findings (exit 2). findings is only set for rc 0/2, so real errors
      # (install failure, bad args) never post a half-baked report.
      if: ${{ always() && inputs.pr-comment == 'true' && steps.run.outputs.findings != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPORT: ${{ steps.run.outputs.report }}
        FINDINGS: ${{ steps.run.outputs.findings }}
      run: |
        set -euo pipefail
        case "$GITHUB_EVENT_NAME" in
          pull_request|pull_request_target) ;;
          *) echo "pr-comment: not a pull request event ($GITHUB_EVENT_NAME) — skipping"; exit 0 ;;
        esac
        command -v gh >/dev/null 2>&1 || { echo "::error::pr-comment needs the gh CLI on the runner"; exit 1; }
        pr=$(jq -r '.pull_request.number // empty' "$GITHUB_EVENT_PATH")
        [ -n "$pr" ] || { echo "pr-comment: could not determine PR number — skipping"; exit 0; }

        marker='<!-- gha-doctor-report -->'
        existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$pr/comments" --paginate \
          --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n1 || true)

        if [ "$FINDINGS" = "false" ] && [ -z "$existing" ]; then
          echo "pr-comment: no findings and no existing comment — staying quiet"
          exit 0
        fi

        body_file="$RUNNER_TEMP/gha-doctor-comment.md"
        {
          echo "$marker"
          if [ "$FINDINGS" = "false" ]; then
            echo "**All clear** — previous findings are resolved. :white_check_mark:"
            echo
          fi
          cat "$REPORT"
          echo
          echo "<sub>posted by [gha-doctor](https://github.com/linnea-bakshi/gha-doctor); updated in place on each run</sub>"
        } > "$body_file"

        # Comment bodies cap at 65536 chars; truncate with a pointer to the logs.
        if [ "$(wc -c < "$body_file")" -gt 60000 ]; then
          head -c 60000 "$body_file" > "$body_file.trunc"
          printf '\n\n…truncated — see the workflow logs for the full report.\n' >> "$body_file.trunc"
          mv "$body_file.trunc" "$body_file"
        fi

        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" \
            -F body=@"$body_file" > /dev/null
          echo "pr-comment: updated comment $existing on PR #$pr"
        else
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$pr/comments" \
            -F body=@"$body_file" > /dev/null
          echo "pr-comment: posted comment on PR #$pr"
        fi
